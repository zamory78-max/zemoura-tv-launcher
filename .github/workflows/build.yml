name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tv-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-debug-apk
          path: tv-launcher.apk
      - name: Publish release (رابط تحميل مباشر)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: أحدث نسخة
          body: "نسخة تجريبية (debug). حمّل tv-launcher.apk وثبّته على الجهاز."
          files: tv-launcher.apk
          make_latest: true
