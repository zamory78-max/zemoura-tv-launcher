name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        env:
          ORG_GRADLE_PROJECT_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ORG_GRADLE_PROJECT_LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-debug-apk
          path: tv-launcher.apk
      - name: Publish release (رابط تحميل مباشر)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: أحدث نسخة
          body: "نسخة إصدار (release) سريعة الإقلاع. حمّل tv-launcher.apk وثبّته على الجهاز."
          files: tv-launcher.apk
          make_latest: true

      - name: نشر نسخة في مستودع التحميلات العام (apps-downloads)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::DOWNLOADS_TOKEN غير مضبوط، تم تخطي النشر في apps-downloads"; exit 0; fi
          gh release view launcher -R zamory78-max/apps-downloads >/dev/null 2>&1 || \
            gh release create launcher -R zamory78-max/apps-downloads --title "Zemoura Launcher" --notes "آخر نسخة من Zemoura Launcher"
          gh release upload launcher tv-launcher.apk -R zamory78-max/apps-downloads --clobber
